name: local_life_app
description: 本地生活综合服务系统 - 移动端 App
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  geolocator: ^10.1.0
  flutter_local_notifications: ^16.3.0
  web_socket_channel: ^2.4.0
  image_picker: ^1.0.7
  amap_flutter_location: ^3.0.0
  amap_flutter_map: ^3.0.0
  go_router: ^13.2.0
  cached_network_image: ^3.3.1
  flutter_secure_storage: ^9.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/